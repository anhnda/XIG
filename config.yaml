# ─────────────────────────────────────────────────────────────────────────────
# attr_probe — Attribution Mechanism Pilot (P0–P3).
# --debug: ghi đè bằng mục `debug:` (ít ảnh, ít bước), ghi vào <out>_debug.
# Viết số thực dạng 0.0001; vô cực viết .inf.
# ─────────────────────────────────────────────────────────────────────────────

seed: 20261116

model:
  arch: resnet50
  weights: IMAGENET1K_V2
  allow_tf32: false
  batch: 64                  # số trạng thái mỗi lần forward+backward

data:
  size: 224
  index_seed: 7
  n_pilot: 20
  n_confirm: 50
  n_other: 10

# Họ đường (chỉ sinh nút; ig phải có, là đường tham chiếu cho bẫy).
paths:
  ig:     {kind: straight, steps: 128}
  spi10:  {kind: spi, alpha: 10, steps: 64, paths: 32, k_group: 8}   # k_group: cỡ nhóm cho thống kê K=8
  guided: {kind: guided, steps: 128, fraction: 0.25, max_dist: 0.02}
  blur:   {kind: blur, steps: 100, max_sigma: 50.0}

# Điểm cầu phương thêm (ngoài nút) ở stage main. canon_left luôn có.
# Quy tắc canonical chính của P1–P3 = canon_rand nếu có "rand".
quadrature: [rand]
idgi_zero_tol: 1.0e-12       # bỏ bước IDGI có ‖g_k‖² ≤ tol · max_k ‖g_k‖²; ΔF bị bỏ báo trong dropped_dF_rel

metrics:
  topk_frac: 0.05
  insdel: {bases: [blur, black], n_steps: 50, batch: 26, blur_kernel: 31, blur_sigma: 10.0}

# P0 — hội tụ (lưới lồng nhau; N phải là bội của nhau)
convergence:
  n_images: 3
  N: [32, 64, 128, 256]
  spi_realizations: 4
  quadrature: [left, mid, rand]

# P1 — đường × quy tắc
exp_a:
  n_images: 16
  diag_step_images: 3        # số ảnh ghi chẩn đoán IDGI từng bước (idgi_steps.csv)
  heatmap_images: 2

# P2 — tín hiệu cộng tính đã biết (trên exp_c.n_images ảnh đầu của exp_a)
exp_c:
  n_images: 6
  B_frac: 0.5                # tổng đóng góp đúng B = ±B_frac·|F(x) − F(x′)|
  sizes: [2, 8, 24]          # cạnh ô vuông (pixel, cả 3 kênh): 4 / 64 / 576 pixel = 12 / 192 / 1728 phần tử
  locations: [inside, outside]
  neg_sign_for: [24]         # thêm dấu âm cho các cỡ này
  scatter_pixels: 576        # tín hiệu phân tán: 576 pixel ngẫu nhiên (1728 phần tử), cùng số phần tử với ô 24×24
  scatter_signs: [1, -1]
  inside_min: 0.8
  outside_max: 0.05
  min_denominator: 0.05      # trung bình (x − x′) trên R tối thiểu (đơn vị chuẩn hoá)
  tries: 400
  region_retries: 20

# P3 — bẫy gradient quanh đường IG (trên exp_b.n_images ảnh đầu của exp_a). Lưới chéo, không đầy đủ:
#   ρ ∈ rho với η = eta_ref;  η ∈ eta với ρ = rho_ref;  + u tần số thấp tại (rho_ref, eta_ref)
exp_b:
  n_images: 6
  rho: [0.03, 0.1, 0.2, 0.3]
  eta: [0.1, 1.0, 3.0]
  rho_ref: 0.1
  eta_ref: 1.0
  u_low_at_ref: true
  low_sigma: 8.0             # σ (pixel) làm mượt u kiểu "low"
  noise_sigma: 0.1           # kiểm hành vi: H tại x + N(0, σ²)
  noise_samples: 16
  n_other: 4                 # số ảnh khác (split other) để đo |H|

# E1–E3: phân rã cơ chế (mục này có hash riêng, sửa không làm mất cache pilot)
mechanism:
  e1:
    n_images: 3
    ig_steps: 64             # IG: đường cố định, N đoạn
    spi_paths: [0, 1, 2, 3]  # đường SPI của pilot (cùng seed), N = paths.spi10.steps
    M: [1, 2, 4, 8, 16]      # điểm/đoạn; lồng nhau, ref = M lớn nhất
    dp_N: [64, 128, 256]     # cùng một đường DP rút ở N lớn nhất, gộp cho lưới thô
    dp_points: 1024          # tổng số điểm cầu phương mỗi lưới (M = dp_points / N)
    dp_realizations: 2
    toy: {seed: 11, d: 32, alpha: 10, b_scale: 1.0, c_scale: 2.0, N_fine: 2048, N: [16, 32, 64, 128, 256, 512], paths: 300}
  e2:
    n_images: 16             # = ảnh của pilot exp_a
    paths: 64                # 32 đường đầu trùng pilot
    M: 2                     # điểm/đoạn (tầng)
    ig_steps: 128
    K_checkpoints: [1, 2, 4, 8, 16, 32, 64]
    per_path_insdel: true    # insertion/deletion (baseline blur) cho từng đường K=1
    heatmap_images: 2
  e3:
    n_images: 6              # = ảnh bẫy của pilot; dùng chung đường và điểm với E2
    rho: [0.03, 0.1, 0.2, 0.3]
    eta: 1.0
    u_low_at: 0.1            # thêm u tần số thấp tại ρ này (null để bỏ)

# E1′ + E4: cổng số học bổ sung và so sánh xuyên phương pháp (hash riêng, không làm mất cache pilot/mechanism)
cross:
  mode_sigma: 2.0            # σ (px) tách tần số thấp/cao của gradient
  focus_images: [seg03807]   # ảnh đối chứng (SPI giảm exposure nhưng IoU giảm)
  gate:
    n_images: 3
    spi_paths: 16            # đường pilot 0..15
    M: [2, 4, 8]             # lồng nhau trên cùng đường
    ig_steps: 128
    toy: {seed: 11, d: 32, alpha: 10, b_scale: 1.0, c_scale: 2.0, q_scale: 3.0, q_dirs: 8,
          N_fine: 1024, N: [16, 32, 64, 128, 256], paths: 200, w_points: 4096}
  e4:
    n_images: 16             # cùng 16 ảnh pilot (gồm seg03807)
    M: 4                     # điểm/đoạn
    spi_paths: 32
    ig_steps: 128            # IG và đoạn thẳng blur → x
    guided_steps: 128
    blur_steps: 100
    tau_bins: 10
    dist_bins: [0.0, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 10.0]
    heatmap_images: 3
  e4c:
    n_images: 16
    alphas: [1000, 100, 30, 10, 3, 1]
    paths: 8
    M: 2
    per_path_insdel: true

# E5: bất đồng bộ hay chọn feature theo gradient (hash riêng)
e5:
  n_images: 16               # cùng 16 ảnh pilot (gồm seg03807)
  M: 2                       # điểm/đoạn cho MỖI bộ cầu phương (a, b) → 4 điểm/đoạn tổng
  ig_steps: 128              # IG và đoạn thẳng blur → x
  blur_steps: 100
  guided_steps: 128
  spi_paths: 16              # đường pilot 0..15 (N = paths.spi10.steps)
  spi_perm_paths: 8          # đối chứng âm: hoán vị "bin" chính 8 đường SPI đầu
  lam_paths: 8               # P2: đường λ khớp hình học Guided
  perm_kinds: [bin, pixel, block]
  perm_draws: 2
  perm_bins: 10              # thập phân vị |Δx| cho bin/pixel
  block: 16                  # cạnh khối (px) cho "block"
  pairs: [[spi, guided], [spi, guided_perm_bin], [guided, guided_perm_bin], [guided, guided_perm_pixel],
          [guided, guided_perm_block], [spi, spi_lam], [guided, spi_lam], [spi_first, spi_perm_bin], [spi, blur], [guided, blur]]
  heatmap_images: 3
  signal: {n_images: 6, sizes: [24], locations: [inside, outside], B_frac: 0.5, inside_min: 0.8, outside_max: 0.05,
           min_denominator: 0.05, tries: 400}

# E6: cô lập gradient guidance (A) và cấu trúc đồng bộ (B) (hash riêng)
e6:
  split: pilot               # pilot = exploratory (16 ảnh cũ); confirm = 50 ảnh mới, lần chạy đầu ghi e6_prereg.json
  n_images: 16
  A: {N: 128, M: 4, perm_seeds: 6, perm_bins: 10, donors: 2, spi_paths: 4}
  B: {N: 64, M: 4, paths: 4, kinds: [indep, rgb, block4, block16, block56, global]}

# E7: nhóm đồng bộ cùng cỡ — bố trí không gian hay số/cỡ nhóm (hash riêng; exploratory trên 16 ảnh pilot)
e7:
  n_images: 16
  S: {N: 64, M: 4, paths: 4, kinds: [indep, rgb, block4, rand16, block16, rand256, global]}
  Njump: {n_images: 6, N: 256, M: 2, paths: 2, kinds: [indep, block4, rand16]}
  Q: {n_images: 6, N: 128, M_hi: 16, M_lo: 4, perm_seeds: 4, donors: 2}

debug:
  e7: {n_images: 1, S: {N: 8, M: 2, paths: 2, kinds: [indep, rgb, block4, rand16, global]},
       Njump: {n_images: 1, N: 16, M: 2, paths: 1, kinds: [indep, block4]},
       Q: {n_images: 1, N: 16, M_hi: 4, M_lo: 2, perm_seeds: 2, donors: 1}}
  e6: {n_images: 1, A: {N: 16, M: 2, perm_seeds: 2, donors: 1, spi_paths: 2},
       B: {N: 8, M: 2, paths: 2, kinds: [indep, rgb, block56, global]}}
  e5: {n_images: 2, ig_steps: 16, blur_steps: 12, guided_steps: 16, spi_paths: 4, spi_perm_paths: 2, lam_paths: 2,
       perm_kinds: [bin, block], block: 56, heatmap_images: 1, signal: {n_images: 1, locations: [inside]}}
  cross:
    gate: {n_images: 1, spi_paths: 3, M: [1, 2, 4], ig_steps: 16,
           toy: {N_fine: 128, N: [16, 64], paths: 30, w_points: 512}}
    e4: {n_images: 2, M: 2, spi_paths: 3, ig_steps: 16, guided_steps: 16, blur_steps: 12, heatmap_images: 1}
    e4c: {n_images: 1, alphas: [100, 10, 1], paths: 2, per_path_insdel: false}
  mechanism:
    e1: {n_images: 1, ig_steps: 16, spi_paths: [0], M: [1, 2, 4], dp_N: [8, 32], dp_points: 128, dp_realizations: 1,
         toy: {N_fine: 256, N: [16, 64], paths: 50}}
    e2: {n_images: 2, paths: 4, ig_steps: 16, K_checkpoints: [1, 2, 4], per_path_insdel: false, heatmap_images: 1}
    e3: {n_images: 1, rho: [0.03, 0.3], u_low_at: null}
  paths:
    ig:     {steps: 16}
    spi10:  {steps: 8, paths: 4, k_group: 2}
    guided: {steps: 16}
    blur:   {steps: 12}
  convergence: {n_images: 1, N: [8, 16, 32], spi_realizations: 2}
  exp_a: {n_images: 2, diag_step_images: 1, heatmap_images: 1}
  exp_c: {n_images: 1, sizes: [2, 24], scatter_signs: [1]}
  exp_b: {n_images: 1, rho: [0.03, 0.3], eta: [1.0], u_low_at_ref: false, noise_samples: 4, n_other: 1}
  metrics: {insdel: {n_steps: 10}}

# ─────────────────────────────────────────────────────────────────────────────
local:
  out: runs_probe
  imagenet_mat: gtsegs_ijcv.mat
  exclude_index_files: [runs/seg200.json, runs/imagenet/index.json]   # ảnh đã dùng ở các đợt trước
  device: cuda