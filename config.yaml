# ─────────────────────────────────────────────────────────────────────────────
# attr_probe: đường đi × quy tắc chia credit, bẫy gradient, giữ tín hiệu, sanity check.
#
# Pilot (--split pilot): không cần khoá. Xác nhận (--split confirm): phải `lock` trước, mọi khoá
# ngoài `local:` và `debug:` được băm.
# --debug: ghi đè bằng mục `debug:` (vài ảnh, ít bước), ghi vào <out>_debug.
# Viết số thực dạng 0.0001; vô cực viết .inf.
# ─────────────────────────────────────────────────────────────────────────────

seed: 20261116

model:
  arch: resnet50
  weights: IMAGENET1K_V2
  allow_tf32: false
  batch: 64                  # số trạng thái mỗi lần forward+backward

data:
  size: 224
  index_seed: 7
  n_pilot: 20                # ảnh cho A, B, C, sanity (pilot)
  n_confirm: 50              # ảnh cho xác nhận (D), không giao với pilot
  n_other: 10                # ảnh "khác" để kiểm H có vô hại với hành vi không

baseline: black

# Đường đi. Mọi phương pháp trả về các trạng thái x_0..x_N, f(x_k) và ∂f/∂x tại x_k.
methods:
  ig:     {kind: straight, steps: 128}
  spi10:  {kind: spi, alpha: 10, steps: 64, paths: 32, n_sub: 4}
  guided: {kind: guided, steps: 128, fraction: 0.25, max_dist: 0.02}
  blur:   {kind: blur, steps: 100, max_sigma: 50.0}

# Quy tắc chia credit trên CÙNG các trạng thái:
#   canonical: Σ_k g_k ⊙ (x_{k+1} − x_k)              (Riemann trái)
#   idgi:      Σ_k g_k²/‖g_k‖² · (f(x_{k+1}) − f(x_k))  (Yang et al., CVPR 2023)
rules: [canonical, idgi]

metrics:
  topk_frac: 0.05
  insdel: {bases: [blur, black], n_steps: 50, batch: 26, blur_kernel: 31, blur_sigma: 10.0}
  road: {enabled: true, fracs: [0.1, 0.3, 0.5, 0.7, 0.9], iters: 200, noise: 0.01}

exp_a:
  n_images: 20

exp_b:
  n_images: 6
  shapes: [line, bent]       # line: quanh đường IG (đối chứng dương); bent: đường cong không phương pháp nào đi theo
  rho: [0.01, 0.03, 0.1, 0.3, .inf]    # độ rộng ống r = rho·‖Δx‖; SPI α=10 dự đoán chuyển tiếp ở ρ ≈ 0.03–0.3
  u: [high, low]             # tần số không gian của hướng bẫy
  tau: [1.0]                 # κ chọn sao cho thay đổi IG (giải tích) = tau·‖A_IG(F)‖
  bend: 0.1                  # độ cong của "bent": c(s) = x′ + sΔx + bend·‖Δx‖·sin(πs)·q
  low_sigma: 8.0             # σ (pixel) làm mượt u, q kiểu "low"
  noise_sigma: 0.1           # kiểm vô hại: H tại x + N(0, σ²) (đơn vị chuẩn hoá)

exp_c:
  n_images: 10
  patch: 24                  # cạnh ô vuông R (pixel, mọi kênh)
  gamma: 0.5                 # tổng đóng góp kỳ vọng của S = ±gamma·|D|
  inside_min: 0.8            # ô "trong vật": ≥ 80% diện tích thuộc mask
  outside_max: 0.05          # ô "ngoài vật": ≤ 5%
  tries: 200

sanity:
  n_images: 10
  cascade: [fc, layer4, layer3, layer2]   # khởi tạo lại tích luỹ từ đầu ra vào trong

debug:
  n_images: 2
  methods:
    ig:     {steps: 16}
    spi10:  {steps: 12, paths: 8}
    guided: {steps: 16}
    blur:   {steps: 12}
  exp_b: {rho: [0.01, .inf], u: [high], shapes: [line]}
  metrics: {insdel: {n_steps: 10}, road: {enabled: false}}

# ─────────────────────────────────────────────────────────────────────────────
local:
  out: runs_probe
  imagenet_mat: gtsegs_ijcv.mat
  exclude_index_files: [runs/seg200.json, runs/imagenet/index.json]   # ảnh đã dùng ở các đợt trước
  device: cuda
