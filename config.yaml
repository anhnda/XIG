# ─────────────────────────────────────────────────────────────────────────────
# attr_probe — Attribution Mechanism Pilot (P0–P3).
# --debug: ghi đè bằng mục `debug:` (ít ảnh, ít bước), ghi vào <out>_debug.
# Viết số thực dạng 0.0001; vô cực viết .inf.
# ─────────────────────────────────────────────────────────────────────────────

seed: 20261116

model:
  arch: resnet50
  weights: IMAGENET1K_V2
  allow_tf32: false
  batch: 64                  # số trạng thái mỗi lần forward+backward

data:
  size: 224
  index_seed: 7
  n_pilot: 20
  n_confirm: 50
  n_other: 10

# Họ đường (chỉ sinh nút; ig phải có, là đường tham chiếu cho bẫy).
paths:
  ig:     {kind: straight, steps: 128}
  spi10:  {kind: spi, alpha: 10, steps: 64, paths: 32, k_group: 8}   # k_group: cỡ nhóm cho thống kê K=8
  guided: {kind: guided, steps: 128, fraction: 0.25, max_dist: 0.02}
  blur:   {kind: blur, steps: 100, max_sigma: 50.0}

# Điểm cầu phương thêm (ngoài nút) ở stage main. canon_left luôn có.
# Quy tắc canonical chính của P1–P3 = canon_rand nếu có "rand".
quadrature: [rand]
idgi_zero_tol: 1.0e-12       # bỏ bước IDGI có ‖g_k‖² ≤ tol · max_k ‖g_k‖²; ΔF bị bỏ báo trong dropped_dF_rel

metrics:
  topk_frac: 0.05
  insdel: {bases: [blur, black], n_steps: 50, batch: 26, blur_kernel: 31, blur_sigma: 10.0}

# P0 — hội tụ (lưới lồng nhau; N phải là bội của nhau)
convergence:
  n_images: 3
  N: [32, 64, 128, 256]
  spi_realizations: 4
  quadrature: [left, mid, rand]

# P1 — đường × quy tắc
exp_a:
  n_images: 16
  diag_step_images: 3        # số ảnh ghi chẩn đoán IDGI từng bước (idgi_steps.csv)
  heatmap_images: 2

# P2 — tín hiệu cộng tính đã biết (trên exp_c.n_images ảnh đầu của exp_a)
exp_c:
  n_images: 6
  B_frac: 0.5                # tổng đóng góp đúng B = ±B_frac·|F(x) − F(x′)|
  sizes: [2, 8, 24]          # cạnh ô vuông (pixel, cả 3 kênh): 4 / 64 / 576 pixel = 12 / 192 / 1728 phần tử
  locations: [inside, outside]
  neg_sign_for: [24]         # thêm dấu âm cho các cỡ này
  scatter_pixels: 576        # tín hiệu phân tán: 576 pixel ngẫu nhiên (1728 phần tử), cùng số phần tử với ô 24×24
  scatter_signs: [1, -1]
  inside_min: 0.8
  outside_max: 0.05
  min_denominator: 0.05      # trung bình (x − x′) trên R tối thiểu (đơn vị chuẩn hoá)
  tries: 400
  region_retries: 20

# P3 — bẫy gradient quanh đường IG (trên exp_b.n_images ảnh đầu của exp_a). Lưới chéo, không đầy đủ:
#   ρ ∈ rho với η = eta_ref;  η ∈ eta với ρ = rho_ref;  + u tần số thấp tại (rho_ref, eta_ref)
exp_b:
  n_images: 6
  rho: [0.03, 0.1, 0.2, 0.3]
  eta: [0.1, 1.0, 3.0]
  rho_ref: 0.1
  eta_ref: 1.0
  u_low_at_ref: true
  low_sigma: 8.0             # σ (pixel) làm mượt u kiểu "low"
  noise_sigma: 0.1           # kiểm hành vi: H tại x + N(0, σ²)
  noise_samples: 16
  n_other: 4                 # số ảnh khác (split other) để đo |H|

# E1–E3: phân rã cơ chế (mục này có hash riêng, sửa không làm mất cache pilot)
mechanism:
  e1:
    n_images: 3
    ig_steps: 64             # IG: đường cố định, N đoạn
    spi_paths: [0, 1, 2, 3]  # đường SPI của pilot (cùng seed), N = paths.spi10.steps
    M: [1, 2, 4, 8, 16]      # điểm/đoạn; lồng nhau, ref = M lớn nhất
    dp_N: [64, 128, 256]     # cùng một đường DP rút ở N lớn nhất, gộp cho lưới thô
    dp_points: 1024          # tổng số điểm cầu phương mỗi lưới (M = dp_points / N)
    dp_realizations: 2
    toy: {seed: 11, d: 32, alpha: 10, b_scale: 1.0, c_scale: 2.0, N_fine: 2048, N: [16, 32, 64, 128, 256, 512], paths: 300}
  e2:
    n_images: 16             # = ảnh của pilot exp_a
    paths: 64                # 32 đường đầu trùng pilot
    M: 2                     # điểm/đoạn (tầng)
    ig_steps: 128
    K_checkpoints: [1, 2, 4, 8, 16, 32, 64]
    per_path_insdel: true    # insertion/deletion (baseline blur) cho từng đường K=1
    heatmap_images: 2
  e3:
    n_images: 6              # = ảnh bẫy của pilot; dùng chung đường và điểm với E2
    rho: [0.03, 0.1, 0.2, 0.3]
    eta: 1.0
    u_low_at: 0.1            # thêm u tần số thấp tại ρ này (null để bỏ)

# E1′ + E4: cổng số học bổ sung và so sánh xuyên phương pháp (hash riêng, không làm mất cache pilot/mechanism)
cross:
  mode_sigma: 2.0            # σ (px) tách tần số thấp/cao của gradient
  focus_images: [seg03807]   # ảnh đối chứng (SPI giảm exposure nhưng IoU giảm)
  gate:
    n_images: 3
    spi_paths: 16            # đường pilot 0..15
    M: [2, 4, 8]             # lồng nhau trên cùng đường
    ig_steps: 128
    toy: {seed: 11, d: 32, alpha: 10, b_scale: 1.0, c_scale: 2.0, q_scale: 3.0, q_dirs: 8,
          N_fine: 1024, N: [16, 32, 64, 128, 256], paths: 200, w_points: 4096}
  e4:
    n_images: 16             # cùng 16 ảnh pilot (gồm seg03807)
    M: 4                     # điểm/đoạn
    spi_paths: 32
    ig_steps: 128            # IG và đoạn thẳng blur → x
    guided_steps: 128
    blur_steps: 100
    tau_bins: 10
    dist_bins: [0.0, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 10.0]
    heatmap_images: 3
  e4d:                       # hội tụ heatmap đầu ra (tương quan thứ hạng giữa các phương pháp)
    n_images: 16
    M: 4                     # điểm/đoạn cho MỖI bộ cầu phương (đường tất định có 2 bộ độc lập → trần độ tin cậy)
    ig_steps: 128
    guided_steps: 128
    blur_steps: 100
    spi_paths: 32            # đường pilot 0..31; hai nửa chẵn/lẻ → trần độ tin cậy của SPI
    k_curve: [1, 2, 4, 8, 16, 32]
    pools: [4, 16]           # Spearman/Kendall thêm ở 56×56 và 14×14
    topk: [0.05, 0.1, 0.2]
    heatmap_images: 3
  e4c:
    n_images: 16
    alphas: [1000, 100, 30, 10, 3, 1]
    paths: 8
    M: 2
    per_path_insdel: true

# E5: bất đồng bộ hay chọn feature theo gradient (hash riêng)
e5:
  n_images: 16               # cùng 16 ảnh pilot (gồm seg03807)
  M: 2                       # điểm/đoạn cho MỖI bộ cầu phương (a, b) → 4 điểm/đoạn tổng
  ig_steps: 128              # IG và đoạn thẳng blur → x
  blur_steps: 100
  guided_steps: 128
  spi_paths: 16              # đường pilot 0..15 (N = paths.spi10.steps)
  spi_perm_paths: 8          # đối chứng âm: hoán vị "bin" chính 8 đường SPI đầu
  lam_paths: 8               # P2: đường λ khớp hình học Guided
  perm_kinds: [bin, pixel, block]
  perm_draws: 2
  perm_bins: 10              # thập phân vị |Δx| cho bin/pixel
  block: 16                  # cạnh khối (px) cho "block"
  pairs: [[spi, guided], [spi, guided_perm_bin], [guided, guided_perm_bin], [guided, guided_perm_pixel],
          [guided, guided_perm_block], [spi, spi_lam], [guided, spi_lam], [spi_first, spi_perm_bin], [spi, blur], [guided, blur]]
  heatmap_images: 3
  signal: {n_images: 6, sizes: [24], locations: [inside, outside], B_frac: 0.5, inside_min: 0.8, outside_max: 0.05,
           min_denominator: 0.05, tries: 400}

# E6: cô lập gradient guidance (A) và cấu trúc đồng bộ (B) (hash riêng)
e6:
  split: pilot               # pilot = exploratory (16 ảnh cũ); confirm = 50 ảnh mới, lần chạy đầu ghi e6_prereg.json
  n_images: 16
  A: {N: 128, M: 4, perm_seeds: 6, perm_bins: 10, donors: 2, spi_paths: 4}
  B: {N: 64, M: 4, paths: 4, kinds: [indep, rgb, block4, block16, block56, global]}

# E7: nhóm đồng bộ cùng cỡ — bố trí không gian hay số/cỡ nhóm (hash riêng; exploratory trên 16 ảnh pilot)
e7:
  n_images: 16
  S: {N: 64, M: 4, paths: 4, kinds: [indep, rgb, block4, rand16, block16, rand256, global]}
  Njump: {n_images: 6, N: 256, M: 2, paths: 2, kinds: [indep, block4, rand16]}
  Q: {n_images: 6, N: 128, M_hi: 16, M_lo: 4, perm_seeds: 4, donors: 2}

# E8: XÁC NHẬN HELD-OUT. Lần chạy đầu ghi e8_prereg.json + E8_PREREG.md; sau đó KHÔNG sửa mục này
# (và paths / metrics / model / data / seed) — mọi lần chạy sau phải trùng hash, nếu không chương trình dừng.
e8:
  split: confirm             # 50 ảnh chưa dùng (không giao pilot, không giao 250 ảnh của các đợt trước)
  n_images: 50
  alpha: 10
  N: 64
  N_fine: 256                # lịch trình rút ở N_fine rồi cộng gộp xuống N (cùng realization cho cổng số học)
  M: 4                       # điểm cầu phương phân tầng mỗi đoạn
  K: 4                       # đường mỗi kiểu nhóm mỗi ảnh; metric từng đường (K = 1), trung bình trong ảnh
  kinds: [indep, rgb, rand16, block4, block16, rand256, global]
  gate: {n_images: 12, kinds: [block16, rand256], M: 2}
  stats: {bootstrap: 10000, alpha: 0.05, seed: 8}
  global_signed_ratio_max: 1.5   # ‖A_global − A_IG,a‖₁ / ‖A_IG,b − A_IG,a‖₁ (median qua ảnh)
  hypotheses:
    - {id: H1, a: rgb, b: indep, metrics: [iou, insdel_blur], test: two_sided, family: primary}
    - {id: H2, a: rand16, b: rgb, metrics: [iou, insdel_blur, insdel_black], test: equivalence, margin: 0.02}
    - {id: H3, a: block4, b: rand16, metrics: [insdel_black], test: less, family: primary}
    - {id: H4, a: block16, b: rand256, metrics: [exposure_ratio, insdel_black], test: two_sided, family: primary}
    - {id: H5, a: global, b: ig, metrics: [iou, insdel_blur, insdel_black], test: equivalence, margin: 0.01}
  secondary_guided: {enabled: true, N: 128, M: 8, donors: 2}

# E9: cơ chế (hash riêng; dùng lại seed và realization của E8 cho A1/A2 nên phụ thuộc mục e8)
e9:
  A: {split: confirm, n_images: 6, K: 4, M: [16, 64], ref_N: 256, ref_M: 16}   # A1: bất biến global ≡ IG
  H1: {n_images: 8, M: 4}                                                         # A2: rgb − indep ở N_fine của E8
  B: {split: pilot, n_images: 16, alpha: 10, N: 64, M: 4, K: 8, q: [0, 0.25, 0.5, 0.75, 1], per_path_insdel: true,
      interaction: {grid: 8, t: [0.25, 0.5, 0.75], step: 0.5}}

# OCS — Output Convergence Study (hash riêng). split: pilot = exploratory (16 ảnh cũ); fresh = ảnh CHƯA dùng ở bất kỳ lượt nào
# (lần chạy fresh đầu tiên ghi ocs_prereg.json; sau đó không sửa mục này). Luật quyết định nằm ở `decision`.
ocs:
  split: pilot
  n_images: 16
  M: 4                       # điểm/đoạn cho MỖI bộ cầu phương (đường tất định có 2 bộ → within)
  ig_steps: 128
  guided_steps: 128
  blur_steps: 100
  spi_paths_per_half: 16     # hai tập đường SPI rời nhau (đường pilot 0..15 và 16..31)
  k_list: [1, 2, 4, 8, 16]
  shuffle_block: 16          # null: xáo khối 16×16 của bản đồ thứ hai
  metrics: {pools: [4, 16], topk: [0.01, 0.05, 0.1, 0.2], rbo_p: 0.998, radii: [2, 4, 8], sw_proj: 64, sw_pool: 4}
  consensus: {methods: [spi, guided, blur], top_frac: 0.1, draws: 8, min_size: 50, bases: [blur, black]}
  decision: {key_pair: [spi, guided], rank_ratio_min: 0.8, signed_ratio_min: 0.8, sign_agree_min: 0.8,
             consensus_base: blur, consensus_metric: del_logit}
  heatmap_images: 3

# E10 — Random Path Family Ablation (hash riêng). Chạy trên ảnh fresh CHƯA dùng (bỏ qua fresh_offset ảnh đầu, dành cho OCS);
# lần chạy đầu ghi e10_prereg.json (kèm kết quả hiệu chuẩn δ, σ); sau đó KHÔNG sửa mục này.
e10:
  split: fresh
  fresh_offset: 100
  n_images: 50
  alpha: 10
  N: 64
  M: 4
  K_half: 8                  # hai tập 8 đường rời nhau; đầu ra chính = trung bình 16 đường
  per_path_insdel: false
  gate: {n_images: 6, paths: 4, M_hi: 16}       # sai số cầu phương: cùng đường, M so với M_hi
  calib: {d: 20000, seed: 10}                    # Monte Carlo hiệu chuẩn σ (không dùng ảnh)
  metrics: {pools: [4, 16], topk: [0.05, 0.1, 0.2], rbo_p: 0.998, radii: [4], sw_proj: 32, sw_pool: 4}
  stats: {bootstrap: 10000, alpha: 0.05, seed: 10}
  hypotheses:
    - {id: H1, a: smooth, b: dp, metrics: [iou, insdel_blur, insdel_black], test: equivalence, margin: 0.02}
    - {id: H2, a: lognormal, b: dp, metrics: [iou, insdel_blur, insdel_black], test: equivalence, margin: 0.02}
    - {id: H3, a: smooth, b: dp, metrics: [stab_cos_elem, stab_spearman_abs], test: two_sided, family: primary}
    - {id: H4, a: lognormal, b: dp, metrics: [stab_cos_elem, stab_spearman_abs], test: two_sided, family: primary}
    - {id: H5, a: dp, b: ig, metrics: [iou, insdel_blur, insdel_black], test: two_sided, family: primary}

# E11 — LIG chỉ Phase 1 (tối ưu μ, không tối ưu đường) trên mẫu đường SPI và biến thể cho trước (hash riêng).
e11:
  split: pilot               # pilot = exploratory; fresh = ảnh chưa dùng, bắt đầu từ fresh_offset (sau OCS và E10)
  fresh_offset: 200
  n_images: 16
  N: 50                      # số bước như bài LIG
  K: 6                       # mẫu đường mỗi họ (IG: 1)
  alpha: 10
  calib: {d: 20000, seed: 10}                  # δ, σ cho smooth / lognormal (khớp D với DP α như E10)
  paths: [ig, "dp:10", "dp:1", "dp:100", smooth, lognormal, "rgb:10", "block4:10"]
  estimators: [uniform, uniform_rescale, lig, lig_norescale, lig_legacy, lig_tau, mu_df, mu_proj]
  lam: 1.0                   # mặc định của bài
  tau: 0.01
  tau_alt: 1.0               # lig_tau: τ lớn hơn, μ ít dồn hơn
  mu_iter: 300
  per_path_insdel: true
  insdel_bases: [blur, black]
  insdel_steps: 50
  rule: {win_rate_min: 0.8, metrics_min: 2}

# E12 — R_nl có dự đoán khi nào exploration quá mạnh gây hại? (hash riêng; ảnh fresh từ fresh_offset, sau OCS / E10 / E11;
# lần chạy đầu ghi e12_prereg.json; sau đó KHÔNG sửa mục này)
e12:
  split: fresh
  fresh_offset: 300
  n_images: 40
  N: 64
  M: 4
  K: 16
  families: [dp]             # thêm lognormal (khớp D theo từng α) CHỈ khi R_nl đạt trường hợp 2
  levels: {dp: [1, 10, 100, 1000], lognormal: [1, 10, 100, 1000]}
  calib: {d: 20000, seed: 12}
  per_path_insdel: true
  insdel_bases: [blur, black]
  insdel_steps: 50
  gate: {n_images: 8, K: 4, M: [4, 8, 16, 32], M_hi: 32}
  decision: {low_level: 1, ref_level: 10, metrics_min: 2, gate_tol: 0.01}

# P4 — Real-CNN Stochastic Path Sampling Benchmark (hash riêng theo khối; không làm mất cache P0–P3 / E*).
# S0 = đúng SPI hiện tại: α, N lấy từ paths.<spi_from> (không ghi đè được). Mọi đường tốn N·M lượt forward+backward.
sampling:
  spi_from: spi10
  M: 1                       # điểm cầu phương phân tầng mỗi đoạn; M = 1 ≡ canon_rand (estimator canonical của P1–P3)
  n_images: 16               # tiền tố split pilot (đúng 16 ảnh của P1 exp_a); không chọn ảnh theo kết quả
  seeds: 4                   # ensemble độc lập mỗi (ảnh, phương pháp, K)
  K: [2, 4, 8, 16]           # luỹ thừa của 2; các K là tiền tố của cùng ngân hàng đường (thiết kế cân bằng lồng nhau)
  grid: 7                    # lưới patch chính 7×7 (patch 32×32 trên 224×224)
  eta: 0.0                   # η của lượt chính: 0 = lịch trình thuần cấp patch
  primary: [S0, S1, S2, S3, S4, S6]    # S6 = đối chứng cùng operator cho S2/S3/S4 (bắt buộc để tách "đổi operator" và "cân bằng")
  reference:
    enabled: true
    K: 64                    # đường độc lập cho μ_ref mỗi operator (khoá riêng, không rò vào ensemble)
    operators: [spi, patch]  # patch = lưới chính, η chính
    quad_gate_paths: 4       # nhiễu cầu phương: cùng đường S0, thêm một bộ U độc lập
  secondary:                 # thứ tự ưu tiên; chỉ chạy khi ước tính còn trong budget.secondary_minutes
    # A — cân bằng giữa các đường nhưng mỗi phần tử có lịch riêng (đúng q_SPI, cùng hình dạng số gia với S0)
    - {name: pixel, methods: [S2p, S3p, S4p]}
    # B — quét η, mỗi η có đối chứng độc lập S6 cùng η (η = 0 là lượt chính; η = 1 ≡ đường S0, kiểm tra operator biến mất)
    - {name: eta05, methods: [S6, S2, S4], eta: 0.5}       # giữ tên/cấu hình cũ ⇒ dùng lại cache
    - {name: eta025, methods: [S6, S2, S4], eta: 0.25}
    - {name: eta075, methods: [S6, S2, S4], eta: 0.75}
    - {name: eta1, methods: [S6, S2, S4], eta: 1.0}
    - {name: controls, methods: [S5, S7]}
    - {name: grid14, methods: [S6, S2, S4], grid: 14}
  # C — cùng tập đường (seed `seed` của ensemble chính), cầu phương M điểm/đoạn; lệnh riêng: bash scripts/run.sh sampling-quad
  quad_check: {n_images: 4, seed: 0, M: [1, 2, 4, 8], methods: [S0, S2, S6]}
  lime: {n_samples: 256, kernel_width: 0.25, ridge: 1.0, tau: 0.25}    # S7: prior thứ tự mềm (high-last); forward tính riêng
  insdel_bases: [blur, black]
  insdel_steps: 50
  signed_ranking_secondary: true      # thêm InsDel xếp hạng theo Σ_c A (có dấu) ở K = K_max — phân tích PHỤ, có nhãn
  overlap_tol: 0.125         # hai patch "chồng thời gian" nếu |τ_g − τ_h| < tol
  locality: {n_null: 20}     # D3: số hoán vị cho mức nền
  keep_seed_maps: false      # giữ bản đồ ensemble từng seed trong cache sau khi đã tổng hợp ảnh
  budget: {minutes: 30, secondary_minutes: 120, quad_minutes: 30, slack: 1.25, enforce: true}
  stats: {bootstrap: 10000, seed: 4, alpha: 0.05, min_effect: 0.01, min_images: 16, win_frac: 0.5}

debug:
  sampling: {n_images: 2, seeds: 2, K: [2, 4], insdel_steps: 10,
             reference: {K: 8, quad_gate_paths: 2},
             secondary: [{name: pixel, methods: [S2p, S3p, S4p]}, {name: eta05, methods: [S6, S2, S4], eta: 0.5},
                         {name: eta1, methods: [S6, S2, S4], eta: 1.0}, {name: controls, methods: [S5, S7]}],
