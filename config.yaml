# ─────────────────────────────────────────────────────────────────────────────
# attr_probe — Attribution Mechanism Pilot (P0–P3).
# --debug: ghi đè bằng mục `debug:` (ít ảnh, ít bước), ghi vào <out>_debug.
# Viết số thực dạng 0.0001; vô cực viết .inf.
# ─────────────────────────────────────────────────────────────────────────────

seed: 20261116

model:
  arch: resnet50
  weights: IMAGENET1K_V2
  allow_tf32: false
  batch: 64                  # số trạng thái mỗi lần forward+backward

data:
  size: 224
  index_seed: 7
  n_pilot: 20
  n_confirm: 50
  n_other: 10

# Họ đường (chỉ sinh nút; ig phải có, là đường tham chiếu cho bẫy).
paths:
  ig:     {kind: straight, steps: 128}
  spi10:  {kind: spi, alpha: 10, steps: 64, paths: 32, k_group: 8}   # k_group: cỡ nhóm cho thống kê K=8
  guided: {kind: guided, steps: 128, fraction: 0.25, max_dist: 0.02}
  blur:   {kind: blur, steps: 100, max_sigma: 50.0}

# Điểm cầu phương thêm (ngoài nút) ở stage main. canon_left luôn có.
# Quy tắc canonical chính của P1–P3 = canon_rand nếu có "rand".
quadrature: [rand]
idgi_zero_tol: 1.0e-12       # bỏ bước IDGI có ‖g_k‖² ≤ tol · max_k ‖g_k‖²; ΔF bị bỏ báo trong dropped_dF_rel

metrics:
  topk_frac: 0.05
  insdel: {bases: [blur, black], n_steps: 50, batch: 26, blur_kernel: 31, blur_sigma: 10.0}

# P0 — hội tụ (lưới lồng nhau; N phải là bội của nhau)
convergence:
  n_images: 3
  N: [32, 64, 128, 256]
  spi_realizations: 4
  quadrature: [left, mid, rand]

# P1 — đường × quy tắc
exp_a:
  n_images: 16
  diag_step_images: 3        # số ảnh ghi chẩn đoán IDGI từng bước (idgi_steps.csv)
  heatmap_images: 2

# P2 — tín hiệu cộng tính đã biết (trên exp_c.n_images ảnh đầu của exp_a)
exp_c:
  n_images: 6
  B_frac: 0.5                # tổng đóng góp đúng B = ±B_frac·|F(x) − F(x′)|
  sizes: [2, 8, 24]          # cạnh ô vuông (pixel, cả 3 kênh): 4 / 64 / 576 pixel = 12 / 192 / 1728 phần tử
  locations: [inside, outside]
  neg_sign_for: [24]         # thêm dấu âm cho các cỡ này
  scatter_pixels: 576        # tín hiệu phân tán: 576 pixel ngẫu nhiên (1728 phần tử), cùng số phần tử với ô 24×24
  scatter_signs: [1, -1]
  inside_min: 0.8
  outside_max: 0.05
  min_denominator: 0.05      # trung bình (x − x′) trên R tối thiểu (đơn vị chuẩn hoá)
  tries: 400
  region_retries: 20

# P3 — bẫy gradient quanh đường IG (trên exp_b.n_images ảnh đầu của exp_a). Lưới chéo, không đầy đủ:
#   ρ ∈ rho với η = eta_ref;  η ∈ eta với ρ = rho_ref;  + u tần số thấp tại (rho_ref, eta_ref)
exp_b:
  n_images: 6
  rho: [0.03, 0.1, 0.2, 0.3]
  eta: [0.1, 1.0, 3.0]
  rho_ref: 0.1
  eta_ref: 1.0
  u_low_at_ref: true
  low_sigma: 8.0             # σ (pixel) làm mượt u kiểu "low"
  noise_sigma: 0.1           # kiểm hành vi: H tại x + N(0, σ²)
  noise_samples: 16
  n_other: 4                 # số ảnh khác (split other) để đo |H|

debug:
  paths:
    ig:     {steps: 16}
    spi10:  {steps: 8, paths: 4, k_group: 2}
    guided: {steps: 16}
    blur:   {steps: 12}
  convergence: {n_images: 1, N: [8, 16, 32], spi_realizations: 2}
  exp_a: {n_images: 2, diag_step_images: 1, heatmap_images: 1}
  exp_c: {n_images: 1, sizes: [2, 24], scatter_signs: [1]}
  exp_b: {n_images: 1, rho: [0.03, 0.3], eta: [1.0], u_low_at_ref: false, noise_samples: 4, n_other: 1}
  metrics: {insdel: {n_steps: 10}}

# ─────────────────────────────────────────────────────────────────────────────
local:
  out: runs_probe
  imagenet_mat: gtsegs_ijcv.mat
  exclude_index_files: [runs/seg200.json, runs/imagenet/index.json]   # ảnh đã dùng ở các đợt trước
  device: cuda
